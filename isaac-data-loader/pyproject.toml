[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-data"
version = "0.1.3"
description = "Python loader for the ISAAC Reddit corpus (Illinois Social Attitudes Aggregate Corpus) direct-download endpoint."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Babak Hemmatian", email = "babak.hemmatian@gmail.com" },
]
maintainers = [
    { name = "ISAAC / Social Cognition Lab, University of Illinois Urbana-Champaign" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ISAAC", "reddit", "corpus", "dataset", "nlp", "social-attitudes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Sociology",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "requests>=2.25",
    "pandas>=1.3",
    "pyarrow>=10",
    "fsspec>=2023.1.0",
    "aiohttp>=3.8",
    "platformdirs>=3",
]

[project.optional-dependencies]
polars = ["polars>=0.20"]
docs = ["pdoc>=14"]
dev = ["pytest>=7", "pdoc>=14"]

[project.scripts]
isaac-data = "isaac_data.cli:main"

[project.urls]
Homepage = "https://isaac.psychology.illinois.edu/"
Documentation = "https://isaac.psychology.illinois.edu/direct-download/"
Source = "https://github.com/BabakHemmatian/Illinois_Social_Attitudes/tree/main/isaac-data-loader"
Issues = "https://github.com/BabakHemmatian/Illinois_Social_Attitudes/issues"
# TODO(release): repoint at the arXiv record once announced (RELEASE_TODO 5.2).
Citation = "https://github.com/BabakHemmatian/Illinois_Social_Attitudes/blob/main/CITATION.cff"

[tool.setuptools.packages.find]
where = ["."]
include = ["isaac_data*"]
